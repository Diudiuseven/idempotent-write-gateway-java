server.port=0

# ---- 幂等执行网关配置 ----
# 已完成/失败结果在内存中的保留时长，过期后同一键可重新执行（应大于最长单次执行耗时）
idempotency.entry-ttl=10m
# 合并等待方等待在途执行结果的最长时长，超时返回 504，不影响在途执行
idempotency.wait-timeout=30s
# 过期条目清理任务的执行间隔
idempotency.cleanup-interval=1m
# 同时处于执行中的最大请求数，超出返回 429
idempotency.max-in-flight=64
# 同一个键允许挂起的最大等待方数量，超出返回 429
idempotency.max-waiters-per-key=256
# 内存中保留的最大键数量，超出后新键返回 429
idempotency.max-entries=10000
