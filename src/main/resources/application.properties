server.port=0

# ================= 幂等网关配置 =================
# 已完成 / 不可重试失败条目的有效期，过期后同一键可重新执行（默认 10 分钟）
idempotency.ttl=10m
# 合并等待的最长等待时间；超时仅放弃本次等待，不影响在途执行（默认 30 秒）
idempotency.wait-timeout=30s
# 可重试失败 / 被拒绝条目的状态保留时长（仅影响观测可见性，不阻塞重试；默认 1 秒）
idempotency.retryable-failure-ttl=1s
# 执行并发上限：同时进行的下游执行数，超出返回 REJECTED_CAPACITY（默认 200）
idempotency.max-concurrent-executions=200
# 单个在途键允许的最大等待者数量，超出返回 REJECTED_TOO_MANY_WAITERS（默认 1000）
idempotency.max-waiters=1000
# 过期条目清理间隔（默认 30 秒）
idempotency.cleanup-interval=30s
# 下游写入模拟处理延迟，用于演示在途合并（默认 0）
idempotency.downstream-delay=0s
